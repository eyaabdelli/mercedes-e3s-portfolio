<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activités — E3S</title><link rel="stylesheet" href="assets/style.css"><style>.wrap{max-width:1000px;margin:40px auto;padding:0 20px}.item{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin:15px 0}.item input,.item textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 10px}.btn{padding:9px 14px;background:#111;color:#fff;border:0}</style></head><body><header class="site-header"><div class="nav-inner"><div class="logo">E3S · ACTIVITÉS</div><nav class="nav-links"><a href="admin.html">Dashboard</a><a href="#" onclick="logout()">Déconnexion</a></nav></div>
</header>

<button class="back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}" title="Retour">←</button>
<main class="wrap"><h1>Showroom · Atelier · Magasin</h1><div id="list"></div></main><script src="admin.js"></script><script>requireLogin();const list=document.getElementById('list');async function load(){const r=await api('/api/activites');const a=await r.json();list.innerHTML=a.map(x=>`<article class="item"><input id="t${x.id}" value="${x.type||''}"><textarea id="d${x.id}" rows="4">${x.description||''}</textarea><input id="p${x.id}" value="${x.photo||''}" placeholder="Nom image"><button class="btn" onclick="save(${x.id})">Enregistrer</button> <button onclick="del(${x.id})">Supprimer</button></article>`).join('')||'<p>Aucune activité.</p>'}async function save(id){const r=await api('/api/activites/'+id,{method:'PUT',body:JSON.stringify({type:document.getElementById('t'+id).value,description:document.getElementById('d'+id).value,photo:document.getElementById('p'+id).value})});if(r.ok)alert('Activité enregistrée');else alert('Erreur')}async function del(id){if(confirm('Supprimer ?')){const r=await api('/api/activites/'+id,{method:'DELETE'});if(r.ok)load()}}load();</script></body></html>
