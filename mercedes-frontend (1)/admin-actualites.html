<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualités — E3S</title><link rel="stylesheet" href="assets/style.css"><style>.wrap{max-width:1000px;margin:40px auto;padding:0 20px}.form,.item{background:#fff;padding:20px;border:1px solid #ddd;border-radius:8px;margin:15px 0}.form input,.form textarea{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box}.btn{background:#111;color:#fff;padding:10px 15px;border:0}.item-actions{margin-top:12px;display:flex;gap:8px}</style></head><body><header class="site-header"><div class="nav-inner"><div class="logo">E3S · ACTUALITÉS</div><nav class="nav-links"><a href="admin.html">Dashboard</a><a href="#" onclick="logout()">Déconnexion</a></nav></div>
</header>

<button class="back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}" title="Retour">←</button>

<main class="wrap"><h1>Gestion des actualités</h1><form id="form" class="form"><input type="hidden" id="id"><input id="titre" placeholder="Titre" required><input id="type" placeholder="Type : Nouveauté, Service, Événement..."><input id="photo" placeholder="Nom de l'image"><textarea id="contenu" rows="5" placeholder="Contenu" required></textarea><button class="btn">Enregistrer</button> <button type="button" onclick="resetForm()">Nouveau</button></form><div id="list"></div></main><script src="admin.js"></script><script>requireLogin();const $=id=>document.getElementById(id);let items=[];async function load(){const r=await api('/api/actualites');items=await r.json();$('list').innerHTML=items.map(a=>`<article class="item"><h2>${a.titre||''}</h2><small>${a.type||''} — ${a.datePublication?new Date(a.datePublication).toLocaleDateString('fr-FR'):''}</small><p>${a.contenu||''}</p><div class="item-actions"><button onclick="edit(${a.id})">Modifier</button><button onclick="del(${a.id})">Supprimer</button></div></article>`).join('')||'<p>Aucune actualité.</p>'}function resetForm(){$('form').reset();$('id').value=''}function edit(id){const a=items.find(x=>x.id===id);$('id').value=a.id;$('titre').value=a.titre||'';$('type').value=a.type||'';$('photo').value=a.photo||'';$('contenu').value=a.contenu||''}$('form').addEventListener('submit',async e=>{e.preventDefault();const id=$('id').value;const d={titre:$('titre').value,type:$('type').value,photo:$('photo').value,contenu:$('contenu').value};const r=await api(id?'/api/actualites/'+id:'/api/actualites',{method:id?'PUT':'POST',body:JSON.stringify(d)});if(r.ok){resetForm();load()}else alert('Erreur')});async function del(id){if(confirm('Supprimer ?')){const r=await api('/api/actualites/'+id,{method:'DELETE'});if(r.ok)load()}}load();</script></body></html>
